import org.gradle.api.file.DuplicatesStrategy
plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id 'org.jetbrains.kotlin.jvm' version '2.4.10'
	id "org.jetbrains.kotlin.kapt" version '2.4.10'
	id "org.jetbrains.kotlin.plugin.lombok" version '2.4.10'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Owo lib
	maven { url 'https://maven.wispforest.io/releases/' }
	maven { url 'https://jitpack.io' }

	// Mod Menu
	maven { url "https://api.modrinth.com/maven" }

	// Репозиторий Plasmo Voice API
	maven {
		name = "plasmoverse-releases"
		url = "https://repo.plasmoverse.com/releases"
	}

	// Snapshot Plasmo Voice
	maven {
		name = "plasmoverse-snapshots"
		url = "https://repo.plasmoverse.com/snapshots"
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"chunk-destroyer" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Owo lib
	modImplementation "io.wispforest:owo-lib:${project.owo_version}"
	include "io.wispforest:owo-sentinel:${project.owo_version}"
	kapt "io.wispforest:owo-lib:${project.owo_version}"

	// Mod Menu
	modImplementation "maven.modrinth:modmenu:17.0.0"

	// Kotlin
	modImplementation "net.fabricmc:fabric-language-kotlin:1.13.12+kotlin.2.4.0"

	// Plasmo Voice API
	modCompileOnly "su.plo.voice.api:client:2.1.14"

    // Plasmo Voice only for IDE
	modLocalRuntime "maven.modrinth:1bZhdhsH:hk5FJncK"

	modLocalRuntime "me.lucko:fabric-permissions-api:0.3.3"

	// Vosk and JNA
	implementation "com.alphacephei:vosk:0.3.38"
	implementation "net.java.dev.jna:jna:5.14.0"
	testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	def projectName = project.name

	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}

	from {
		configurations.runtimeClasspath
				.filter { it.name.contains("vosk") || it.name.contains("jna") }
				.collect {
					it.isDirectory() ? it : zipTree(it)
				}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}

sourceSets{
	main{
		resources{
			srcDirs = ['src/main/resources']
		}
	}
}

kotlin{
	jvmToolchain (21)
}

kapt {
	keepJavacAnnotationProcessors = true
}